steps:
  # Build backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/pollaris-backend:latest', '-f', 'backend/Dockerfile', 'backend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pollaris-backend:latest']

  # Build frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/pollaris-frontend:latest', '-f', 'frontend/Dockerfile', '--build-arg', 'VITE_API_URL=$_VITE_API_URL', 'frontend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pollaris-frontend:latest']

images:
  - 'gcr.io/$PROJECT_ID/pollaris-backend:latest'
  - 'gcr.io/$PROJECT_ID/pollaris-frontend:latest'
