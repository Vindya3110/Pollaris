steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/pollaris-frontend:latest', '-f', 'frontend/Dockerfile', '--build-arg', 'VITE_API_URL=$_VITE_API_URL', 'frontend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pollaris-frontend:latest']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pollaris-frontend'
      - '--image=gcr.io/$PROJECT_ID/pollaris-frontend:latest'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--port=80'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--timeout=300'
      - '--max-instances=20'

images:
  - 'gcr.io/$PROJECT_ID/pollaris-frontend:latest'
