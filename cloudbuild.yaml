# Build with no-cache to bust Docker layer cache
steps:
  # Build backend (no cache)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pollaris-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # Build frontend (no cache)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pollaris-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - '--build-arg'
      - 'VITE_API_URL=$_VITE_API_URL'
      - 'frontend'

images:
  - 'gcr.io/$PROJECT_ID/pollaris-backend:latest'
  - 'gcr.io/$PROJECT_ID/pollaris-frontend:latest'
