server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend service (stable Cloud Run URL)
    location /api/ {
        proxy_pass https://pollaris-backend-1061288659823.us-central1.run.app/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # Proxy WebSocket connections to the backend
    location /ws {
        proxy_pass https://pollaris-backend-1061288659823.us-central1.run.app/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # Serve static files, fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
