services:
  mongodb:
    image: mongo:7
    container_name: pollaris-mongo
    restart: always
    # No external port mapping — only backend (same network) needs access
    environment:
      MONGO_INITDB_DATABASE: pollaris
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: pollaris-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --appendfsync always
      --save 60 1
      --save 30 5
      --save 10 1000
      --no-appendfsync-on-rewrite no
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pollaris-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://mongodb:27017/pollaris
      REDIS_ADDR: redis:6379
      PORT: "8080"
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pollaris-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
