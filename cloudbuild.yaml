steps:
  # Build the backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/pollaris-backend', './backend']

  # Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pollaris-backend']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pollaris-backend'
      - '--image=gcr.io/$PROJECT_ID/pollaris-backend'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=300'
      - '--max-instances=10'
    env:
      - 'MONGO_URI=$_MONGO_URI'
      - 'REDIS_ADDR=$_REDIS_ADDR'
      - 'JWT_SECRET=$_JWT_SECRET'
      - 'PORT=8080'

images:
  - 'gcr.io/$PROJECT_ID/pollaris-backend'
