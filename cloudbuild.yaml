# Cloud Build — deploys Pollaris as a single container to Cloud Run
# The Go binary serves both the API and the React frontend static files.
steps:
  # Build the combined Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pollaris:latest'
      - '.'

images:
  - 'gcr.io/$PROJECT_ID/pollaris:latest'
